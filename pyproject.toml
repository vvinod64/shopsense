[project]
name = "shopsense"
version = "0.1.0"
description = "Milestone-based agentic customer support with policy RAG, MCP tools and durable human approval"
readme = "README.md"
authors = [
    { name = "sunilk2903", email = "sunil.k2903@atomicmail.io" }
]
requires-python = ">=3.13"
dependencies = [
    "deepeval>=4.2.8",
    "fastapi>=0.143.0",
    "fastmcp>=3.4,<4.0",
    "google-genai>=2.29.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=3.2.0",
    "langchain-litellm>=0.7,<0.8",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-text-splitters>=1.1,<2",
    "langfuse>=4,<5",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "litellm>=1.105.0",
    "mcp>=1.28",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "supermemory==3.55.0",
    "tenacity>=9.1,<10",
    "trulens-core>=2.15.0",
    "trulens-providers-litellm>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
shopsense = "shopsense:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
